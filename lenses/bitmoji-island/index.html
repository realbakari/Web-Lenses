<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Bitmoji Island</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --sky: #a9d7f7; /* close to the sky behind the island */
        --cream: #fff8ec;
        --cream-2: #f6ead4;
        --ink: #3b2f28;
        --ink-dim: rgba(59, 47, 40, 0.62);
        --green: #4caf50;
        --green-dark: #2f8a3a;
        --coin: #ffc22e;
        --rose: #ff7a8a;
        --font: 'Nunito Variable', 'Avenir Next Rounded', 'Nunito', -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sky);
        color: var(--ink);
        font-family: var(--font);
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 440px;
        max-height: 920px;
        overflow: hidden;
        background: var(--sky);
      }

      @media (min-width: 520px) and (min-height: 600px) {
        #game-container {
          height: 94vh;
          border-radius: 28px;
        }
      }

      canvas#app {
        position: absolute;
        inset: 0;
        display: block;
      }

      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        touch-action: manipulation;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 38px;
        padding: 0 14px 0 8px;
        border-radius: 99px;
        background: var(--cream);
        box-shadow: 0 3px 0 rgba(59, 47, 40, 0.15);
        font-size: 17px;
        font-weight: 900;
      }

      .coin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffe38a, var(--coin) 60%, #e09a10);
        box-shadow: inset 0 0 0 2px #e5a21b;
        flex: none;
      }

      /* ---------- Top bar ---------- */
      .top {
        position: absolute;
        top: calc(var(--safe-top) + 12px);
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 10;
        pointer-events: none;
      }

      .me {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .avatar-wrap {
        position: relative;
        width: 52px;
        height: 52px;
      }

      .avatar {
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: #ffe9c9 center / cover no-repeat;
      }

      .level-ring {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }

      .level-ring circle {
        fill: none;
        stroke-width: 5;
      }

      .level-ring .track {
        stroke: rgba(255, 248, 236, 0.85);
      }

      .level-ring .fill {
        stroke: var(--green);
        stroke-linecap: round;
        transition: stroke-dashoffset 0.4s;
      }

      .level-badge {
        position: absolute;
        right: -4px;
        bottom: -2px;
        min-width: 24px;
        height: 22px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--green);
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        line-height: 22px;
        text-align: center;
        box-shadow: 0 2px 0 var(--green-dark);
      }

      .right-pills {
        display: flex;
        gap: 6px;
      }

      #streak-pill {
        padding: 0 12px;
      }

      /* ---------- Orders ---------- */
      #orders {
        position: absolute;
        top: calc(var(--safe-top) + 74px);
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 10;
        pointer-events: none;
      }

      .order {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 6px 6px;
        border-radius: 14px;
        background: rgba(255, 248, 236, 0.92);
        box-shadow: 0 2px 0 rgba(59, 47, 40, 0.12);
        font-size: 13px;
        font-weight: 800;
      }

      .order .icon {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: var(--cream-2);
        display: grid;
        place-items: center;
        font-size: 18px;
      }

      .order small {
        display: block;
        font-size: 11px;
        font-weight: 800;
        color: var(--ink-dim);
      }

      .bar {
        width: 64px;
        height: 6px;
        margin-top: 3px;
        border-radius: 3px;
        background: var(--cream-2);
        overflow: hidden;
      }

      .bar i {
        display: block;
        height: 100%;
        background: var(--green);
      }

      /* ---------- Bottom tray ---------- */
      .tray {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 10px calc(var(--safe-bottom) + 12px);
        display: flex;
        gap: 8px;
        align-items: stretch;
        z-index: 10;
      }

      #seeds {
        flex: 1;
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 22px;
        background: rgba(255, 248, 236, 0.94);
        box-shadow: 0 4px 0 rgba(59, 47, 40, 0.15);
        overflow-x: auto;
        scrollbar-width: none;
        touch-action: pan-x;
      }

      .seed {
        flex: 1 0 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px 2px 5px;
        border-radius: 16px;
        font-size: 11px;
        font-weight: 900;
        transition: background 0.15s, transform 0.1s;
      }

      .seed .emoji {
        font-size: 24px;
        line-height: 1.1;
      }

      .seed .cost {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .seed .cost .coin {
        width: 11px;
        height: 11px;
        box-shadow: inset 0 0 0 1px #e5a21b;
      }

      .seed .time {
        color: var(--ink-dim);
        font-size: 10px;
      }

      .seed.selected {
        background: #dff3d6;
        box-shadow: inset 0 0 0 2.5px var(--green);
      }

      .seed.locked {
        opacity: 0.45;
      }

      .seed:active {
        transform: scale(0.95);
      }

      .round-btn {
        width: 64px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        border-radius: 22px;
        background: var(--green);
        color: #fff;
        font-size: 11px;
        font-weight: 900;
        box-shadow: 0 4px 0 var(--green-dark);
        transition: transform 0.1s;
      }

      .round-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--green-dark);
      }

      .round-btn svg {
        width: 26px;
        height: 26px;
      }

      /* ---------- Floating feedback ---------- */
      #floats {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 12;
      }

      .float {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 18px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 0 rgba(59, 47, 40, 0.5), 0 0 8px rgba(59, 47, 40, 0.3);
        animation: rise 1.1s ease-out forwards;
        white-space: nowrap;
      }

      .float.xp {
        color: #c9f5b8;
        font-size: 14px;
      }

      @keyframes rise {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.6);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -60%) scale(1.1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -190%) scale(1);
        }
      }

      #hint {
        position: absolute;
        left: 50%;
        bottom: calc(var(--safe-bottom) + 118px);
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 99px;
        background: var(--ink);
        color: var(--cream);
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
        z-index: 11;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      #hint.hidden {
        opacity: 0;
      }

      #banner {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%) scale(0.7);
        padding: 14px 22px;
        border-radius: 22px;
        background: var(--cream);
        box-shadow: 0 6px 0 rgba(59, 47, 40, 0.2);
        text-align: center;
        z-index: 15;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.35s cubic-bezier(0.2, 1.5, 0.4, 1);
      }

      #banner.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #banner-title {
        font-size: 24px;
        font-weight: 900;
        color: var(--green-dark);
      }

      #banner-sub {
        margin-top: 2px;
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-dim);
      }

      /* ---------- Sheets & modals ---------- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(59, 47, 40, 0.35);
        z-index: 30;
        display: flex;
        align-items: flex-end;
        transition: opacity 0.25s, visibility 0.25s;
      }

      .scrim.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .sheet {
        width: 100%;
        max-height: 72%;
        overflow-y: auto;
        touch-action: pan-y;
        padding: 18px 16px calc(var(--safe-bottom) + 18px);
        border-radius: 26px 26px 0 0;
        background: var(--cream);
        transform: translateY(0);
        transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      .scrim.hidden .sheet {
        transform: translateY(100%);
      }

      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .sheet-title {
        font-size: 22px;
        font-weight: 900;
      }

      .close {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--cream-2);
        font-size: 20px;
        font-weight: 900;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 2px 0 rgba(59, 47, 40, 0.1);
        text-align: left;
      }

      .item .icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--cream-2);
        display: grid;
        place-items: center;
        font-size: 24px;
        flex: none;
      }

      .item .name {
        font-size: 15px;
        font-weight: 900;
      }

      .item .desc {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-dim);
      }

      .item .price {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border-radius: 99px;
        background: var(--green);
        color: #fff;
        font-size: 14px;
        font-weight: 900;
        white-space: nowrap;
      }

      .item.cant .price {
        background: #c9bba5;
      }

      .item.owned .price,
      .item.locked .price {
        background: none;
        color: var(--ink-dim);
      }

      .sheet-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 6px;
      }

      .btn {
        height: 48px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 900;
        background: var(--cream-2);
      }

      .btn[hidden] {
        display: none;
      }

      #welcome {
        align-items: center;
        justify-content: center;
      }

      .card {
        width: calc(100% - 48px);
        padding: 22px 20px 18px;
        border-radius: 26px;
        background: var(--cream);
        text-align: center;
        box-shadow: 0 8px 0 rgba(59, 47, 40, 0.2);
      }

      .card .gift {
        font-size: 48px;
        line-height: 1;
      }

      #welcome-title {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 900;
      }

      #welcome-lines {
        margin: 8px 0 16px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.5;
        color: var(--ink-dim);
      }

      #welcome-lines b {
        color: var(--ink);
      }

      .btn-green {
        width: 100%;
        height: 52px;
        border-radius: 18px;
        background: var(--green);
        color: #fff;
        font-size: 17px;
        font-weight: 900;
        box-shadow: 0 4px 0 var(--green-dark);
      }

      #toast {
        position: absolute;
        top: calc(var(--safe-top) + 72px);
        left: 50%;
        padding: 10px 16px;
        border-radius: 99px;
        background: var(--ink);
        color: var(--cream);
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
        transform: translate(-50%, -10px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 50;
      }

      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="app"></canvas>

      <div class="top">
        <div class="me">
          <div class="avatar-wrap">
            <svg class="level-ring" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="23.5" /><circle id="xp-ring" class="fill" cx="26" cy="26" r="23.5" /></svg>
            <div class="avatar" data-avatar></div>
            <div id="level" class="level-badge num">1</div>
          </div>
        </div>
        <div class="right-pills">
          <div class="pill"><span class="coin"></span><span id="coins" class="num">0</span></div>
          <div id="streak-pill" class="pill">🔥 <span id="streak" class="num">1</span></div>
        </div>
      </div>

      <div id="orders"></div>
      <div id="floats"></div>
      <div id="hint">Tap a plot to plant a carrot</div>
      <div id="banner"><div id="banner-title">Level 2!</div><div id="banner-sub">Tomatoes unlocked</div></div>

      <div class="tray">
        <div id="seeds"></div>
        <button id="btn-build" class="round-btn" aria-label="Build">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v9.5h13V10" /><path d="M10 19.5v-5h4v5" /></svg>
          Build
        </button>
      </div>

      <div id="build" class="scrim hidden">
        <div class="sheet">
          <div class="sheet-head">
            <div class="sheet-title">Grow your island</div>
            <button id="btn-close" class="close" aria-label="Close">×</button>
          </div>
          <div id="build-list"></div>
          <div class="sheet-actions">
            <button id="btn-share" class="btn">Share island</button>
            <button id="btn-board" class="btn" hidden>Leaderboard</button>
          </div>
        </div>
      </div>

      <div id="welcome" class="scrim hidden">
        <div class="card">
          <div class="gift">🎁</div>
          <div id="welcome-title">Welcome back!</div>
          <div id="welcome-lines"></div>
          <button id="btn-welcome" class="btn-green">Collect</button>
        </div>
      </div>

      <div id="toast"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
